name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - name: Check Korean font
        shell: pwsh
        run: |
          if (-not (Test-Path C:\Windows\Fonts\malgun.ttf)) {
            throw '맑은 고딕이 설치된 Windows 빌드 환경이 필요합니다.'
          }
      - run: python -m unittest discover -s tests -v
      - run: python scripts/release.py
      - run: python scripts/verify_installer.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Folio-Windows
          path: |
            release/
            evidence/installer-*/result.json
          if-no-files-found: error
